<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCSS Navbar</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<header class="header-hero">
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="images/png/logo.png" alt="Logo" width="120">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Individual Investors</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Financial Advisors</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Pricing</a>
                    </li>
                </ul>
                <a href="#" class="btn btn-try">Try for Free</a>
            </div>
        </div>
    </nav>
</header>
<footer class="footer">
    <div class="newsletter-container">
        <p>Newsletter</p>
        <div class="newsletter-input">
            <input type="email" placeholder="Your email">
            <button><img src="images/png/send.png" alt="Send"></button>
        </div>
    </div>
    <div class="footer-content">
        <div class="footer-logo">
            <img src="images/png/logo.png" alt="Logo">
        </div>
        <div class="footer-links">
            <div class="footer-column">
                <h5>Products</h5>
                <a href="#">Daily Edge</a>
                <a href="#">Weekly Trade Ideas</a>
                <a href="#">Monthly Outlook</a>
                <a href="#">Invictus.learn</a>
            </div>
            <div class="footer-column">
                <h5>Explore</h5>
                <a href="#">CAR Framework</a>
                <a href="#">Pricing</a>
            </div>
        </div>        
    </div>
    <div class="copyright">
        <p>invictus@invictusresearch.ai</p>
    </div>
</footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
